<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias</title>
</head>
<body>  
    <h2>Exemplo de Midia de Imagem:</h2>
    <img src="assets/images/HatsuneMiku.jpg" width="500" title="Hatsune Miku">
    <img src="assets/images/SailorMoon.jpg" width="500" title="Sailor Moon">

    <h2>Exemplo de Midia de Audio</h2>
    <audio controls>
        <source src="assets/audio/MikuMikuBeam.mp3" type="audio/mpeg">
    </audio>

    <hr>

    <h2>Exemplo de Midia de Video:</h2>

    <video controls>
        <source src="video/aesthetic.mp4" type="video/mp4">
    </video>

    <hr>
    
    <video controls>
        <source src="video/aaesthetic.mp4" type="video/mp4">    
    </video>
</body>
</html>
